api_patterns:
  factory_methods:
    - name: "from_params"
      pattern: |
        @classmethod returning cls instance.
        Accepts individual connection parameters with Optional defaults.
        Constructs connection string internally, calls cls(...) + _initialize().
        Key params: host, port, database, user, password (all Optional[str/int]).
        Additional params: table_name (str), schema_name (str), use_jsonb (bool).
      signature: "def from_params(cls, host: Optional[str] = None, ..., use_jsonb: bool = False) -> \"ClassName\""
    - name: "from_uri"
      pattern: |
        @classmethod returning cls instance.
        Parses URI string via urllib.parse.urlparse.
        Delegates to from_params with extracted parameters.
        URI format: scheme://user:pass@host:port/database
      signature: "def from_uri(cls, uri: str, table_name: str = \"...\", ...) -> \"ClassName\""
  error_handling:
    pattern: "silent_none_or_empty"
    custom_exceptions: false                     # No custom exception classes in upstream
    description: |
      CRUD methods return None on missing key / out-of-bounds index / empty result.
      Infrastructure exceptions (connection failure, invalid SQL) propagate upward — no try/except wrapping.
      get_messages for missing key returns [] (empty list), not None.
      delete_messages returns None unconditionally (returns deleted messages as Optional).
      delete_message / delete_last_message return Optional[ChatMessage] — None on missing.
    json_decode_handling: |
      VastbaseChatStore adds defensive json.JSONDecodeError handling in get_messages
      (returns []) — upstream PostgresChatStore relies on SQLAlchemy type coercion.
  connection_management:
    pattern: "lazy_connect_via_initialize"
    description: |
      Upstream: SQLAlchemy create_engine + create_async_engine + sessionmaker (eager connect).
      VastbaseChatStore: pyvastbase connect() + lazy init via _ensure_initialized().
      Sync: pyvastbase Collection (auto-uses global connection pool).
      Async: pyvastbase AsyncCollection + AsyncConnections.connect() with named aliases.
      Context manager pattern: `with self._session() as session, session.begin():`
    session_lifecycle: |
      Upstream uses `with self._session() as session, session.begin()` — dual context manager.
      VastbaseChatStore uses pyvastbase Collection direct API (no context manager needed).
    dual_connection: |
      Upstream maintains separate sync (create_engine) and async (create_async_engine) sessions.
      VastbaseChatStore maintains self._coll (sync Collection) and self._async_coll (AsyncCollection).
  async_strategy:
    pattern: "native_async_override"
    description: |
      Base class (BaseChatStore) provides asyncio.to_thread() default implementations.
      Upstream PostgresChatStore overrides ALL 7 async methods with native async (asyncpg).
      VastbaseChatStore overrides ALL 7 async methods with native pyvastbase AsyncCollection.
      No use of asyncio.to_thread() in either implementation — all 14 methods explicitly written.
    async_naming: "a + method_name"              # aset_messages, aget_messages, async_add_message (note: async_ prefix for add)
    async_naming_inconsistency: |
      UNCERTAIN: Most async methods use "a" prefix (aset_messages, aget_messages, adelete_messages,
      adelete_message, adelete_last_message, aget_keys), but add_message uses "async_add_message"
      instead of "aadd_message". This is inherited from LlamaIndex base class naming.
  constructor_pattern:
    pattern: "**data passthrough"
    description: |
      __init__ accepts **data and passes to super().__init__(**data).
      Pydantic model fields are declared at class level with type annotations.
      PrivateAttr fields initialized in __init__ after super().__init__().
      No explicit positional arguments — all fields are keyword via Pydantic.

serialization:
  chat_message_roundtrip: |
    Write: message.model_dump(mode="json") → json.dumps([...]) → TEXT column
    Read: json.loads(value) → [ChatMessage.model_validate(m) for m in parsed]
    Upstream: message.model_dump_json() for write, ChatMessage.model_validate(json_obj) for read
    Vastbase variant: model_dump(mode="json") + json.dumps for write (pyvastbase TEXT field),
    json.loads + model_validate for read. This is equivalent — model_dump_json() = json.dumps(model_dump(mode="json"))
  json_handling: |
    Upstream: relies on SQLAlchemy ARRAY(JSON) type coercion — model_dump_json() stored as JSON string in array,
    SQLAlchemy auto-deserializes JSON strings back to Python objects on read.
    VastbaseChatStore: manual json.dumps for write, json.loads for read (TEXT column, no ARRAY type).
  column_types:
    primary_key: "INT64 (auto_id=True)"           # Upstream: Integer, primary_key=True, autoincrement=True
    key_column: "VARCHAR(512)"                     # Upstream: VARCHAR, nullable=False
    value_column: "TEXT"                           # Upstream: ARRAY(JSON) or ARRAY(JSONB)
    jsonb_support: |
      Upstream uses use_jsonb toggle: JSONB if True, JSON else.
      Vastbase same behavior — use_jsonb parameter kept for API compat but has no behavioral difference
      (Vastbase TEXT column stores JSON string regardless).
  orm_vs_raw:
    upstream: "SQLAlchemy ORM with dynamic model generation (declarative_base() + type())"
    vastbase: "pyvastbase Collection API (no raw SQL, no ORM)"
    mixed_approach: |
      Upstream mixes ORM queries (select().filter_by()) with raw SQL via text().
      ORM used for SELECT (get_messages, delete_message pre-read, delete_last_message pre-read, get_keys).
      Raw SQL via text() used for INSERT ON CONFLICT (set_messages, add_message) and UPDATE with array slicing.
  data_migration:
    legacy_table_detection: |
      Upstream: _check_legacy_table_exists() via SQLAlchemy inspect.get_table_names().
      Checks for "data_{table_name}" prefix to maintain backward compatibility.
      VastbaseChatStore: uses pyvastbase has_collection("data_{table_name}") for same purpose.

