      Group 1 — stdlib: typing, urllib, json, logging, time, asyncio
      Group 2 — third_party: sqlalchemy, docker (tests only)
      Group 3 — framework: llama_index.core.* (bridge.pydantic, llms, storage.chat_store.base)
      Group 4 — local: same-package relative imports
      No relative imports observed; all imports use absolute paths from llama_index.*
  naming:
    class: "CamelCase"                           # PostgresChatStore, BaseChatStore, AbstractData
    method: "snake_case"                          # set_messages, get_messages, add_message
    private_method: "_snake_case"                 # _connect, _initialize, _create_schema_if_not_exists, _check_legacy_table_exists, _ensure_initialized
    private_attr: "_snake_case"                   # _table_class, _session, _async_session, _coll, _async_coll, _initialized, _actual_table_name, _id_counter
    constant: "not_observed_in_upstream"          # UNCERTAIN: no module-level constants found in upstream source
    function: "snake_case"                        # get_data_model, params_from_uri (standalone functions)
    parameter: "snake_case"                       # table_name, schema_name, use_jsonb, connection_string
  type_annotations:
    style: "from_typing_import"                   # from typing import Any, Optional, List, Dict, Generator, Union
    future_annotations: false                     # Does NOT use `from __future__ import annotations`
    return_style: "explicit_optional"             # Optional[List[ChatMessage]], Optional[ChatMessage]
    dict_type: "Dict[str, Any]"                   # Also: Dict[str, Union[str, Container]]
    list_type: "list[ChatMessage]"                # Modern generic alias used in method signatures (Python 3.10+)
