framework: LlamaIndex
version: v0.14.22
integration_mode: standalone
decisions:
  - id: D-01
    category: "API风格"
    question: "使用同步还是异步 API？"
    decision: "同步+异步对等实现"
    rationale: "PGVectorStore 提供完整的 sync + async 双 API，Vastbase 适配器应保持对等"
    status: confirmed
    confirmed_by: "user"

  - id: D-02
    category: "依赖策略"
    question: "是否引入与上游相同的依赖栈还是用 Vastbase 原生替代？"
    decision: "全部替换为 pyvastbase"
    rationale: "移除 psycopg2-binary, asyncpg, pgvector, sqlalchemy[asyncio]，统一使用 pyvastbase>=0.2.0"
    status: confirmed
    confirmed_by: "user"

  - id: D-03
    category: "错误处理"
    question: "沿用什么级别的错误处理策略？"
    decision: "混合策略（可配置 fail_on_error）"
    rationale: "与 PGVectorStore 的 initialization_fail_on_error 参数一致，初始化阶段 catch+warn，运行时冒泡"
    status: confirmed
    confirmed_by: "user"

  - id: D-04
    category: "MMR支持"
    question: "是否实现 MMR（Maximal Marginal Relevance）？"
    decision: "与 PG 一致，不实现 MMR（抛 ValueError）"
    rationale: "用户明确回复「和pg一致就行」，MMR 在 VectorStore 层面不实现"
    status: confirmed
    confirmed_by: "user"

  - id: D-05
    category: "降级策略"
    question: "Filter 不支持时的降级策略？"
    decision: "客户端降级（ILIKE + 内存过滤 fallback）"
    rationale: "用户选择方案 A，适配器内部实现 fallback，用户无感知"
    status: confirmed
    confirmed_by: "user"

  - id: D-06
    category: "混合搜索"
    question: "混合搜索实现方式？"
    decision: "手动 dense + sparse (text ILIKE) 去重合并"
    rationale: |
      原方案：使用 pyvastbase Collection.hybrid_search(RRFRanker)。
      实施时发现 hybrid_search 需要多个向量字段（dense + sparse vector），但
      LlamaIndex VectorStore schema 只有一个 dense embedding 字段，"sparse" 组件
      实际是 text ILIKE 关键词匹配而非 sparse vector search。因此 hybrid_search API
      不适用于此 schema。改为手动 dense search + text ILIKE query + Python 去重合并，
      与上游 PGVectorStore 的 hybrid search 行为一致（dense-first, unseen sparse append）。
    status: overridden
    confirmed_by: "user"
    override_reason: "schema 不兼容 — hybrid_search 需要 sparse vector 字段，LlamaIndex 仅有 dense vector + text"

  - id: D-07
    category: "文件结构"
    question: "适配器文件结构？"
    decision: "单文件实现（base.py ~800-1000 行）"
    rationale: "用户选择方案 A，与上游 PGVectorStore 结构一致"
    status: confirmed
    confirmed_by: "user"
