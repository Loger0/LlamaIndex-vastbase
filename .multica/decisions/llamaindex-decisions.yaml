# LlamaIndex Vastbase 适配 — 架构决策记录
# Generated by: Framework Analyzer
# Date: 2026-06-17

decisions:
  - id: D-01
    category: API风格
    title: 同步 + 异步对等实现
    decision: |
      VastbaseVectorStore 必须同时实现同步和异步方法。
      每个公开方法（add/delete/query/delete_nodes/get_nodes/clear）
      都需要对应的 async_ 或 a-prefix 异步版本。
    rationale: |
      上游 PGVectorStore 对每个核心操作都提供同步和异步两个版本，
      适配器必须保持完全对等以通过 LlamaIndex 的 async 兼容性检查。
    status: confirmed

  - id: D-02
    category: 依赖策略
    title: 全部替换为 pyvastbase
    decision: |
      移除上游 PGVectorStore 的所有数据库驱动依赖：
      - SQLAlchemy >= 1.4.49（含 asyncio 扩展）
      - psycopg2-binary >= 2.9.9
      - asyncpg >= 0.29.0
      - pgvector >= 0.3.6

      替换为：
      - pyvastbase >= 0.2.0（唯一数据库驱动依赖）
      - llama-index-core >= 0.13.0, < 0.15（保留 LlamaIndex 核心）
    rationale: |
      pyvastbase 0.2.0 提供 VastbaseClient + Collection + AsyncCollection 完整 API，
      可替代所有 SQLAlchemy ORM + 原生驱动操作。
    status: confirmed

  - id: D-03
    category: 错误处理
    title: 混合策略（可配置 fail_on_error）
    decision: |
      通过 add_kwargs 中的 fail_on_error 参数控制插入失败时的行为：
      - fail_on_error=True（默认）：插入失败立即抛出异常
      - fail_on_error=False：跳过失败条目，记录警告日志，继续处理其余数据
    rationale: |
      上游 PGVectorStore 通过 **add_kwargs 透传错误处理策略，
      适配器必须保持相同的接口语义。
    status: confirmed

  - id: D-04
    category: 查询模式
    title: MMR 不实现
    decision: |
      MMR（Max Marginal Relevance）查询模式不在 VastbaseVectorStore 中实现。
      遇 VectorStoreQueryMode.MMR 时抛出 ValueError，与上游 PGVectorStore 行为完全一致。
    rationale: |
      上游 PGVectorStore v0.7.3 对 MMR 模式直接抛出 ValueError，
      MMR 重排逻辑在 LlamaIndex 的 VectorIndexRetriever 层实现。
      用户确认「和pg一致就行」。
    status: confirmed

  - id: D-05
    category: 兼容性策略
    title: 客户端降级
    decision: |
      对 Vastbase 可能不支持的 PG 特有功能采用客户端降级策略：
      - 全文搜索（to_tsvector/to_tsquery/ts_rank/@@）→ 客户端 ILIKE/LIKE
      - JSONB 数组操作符（?|/?&/@>）→ 拉取候选集后 Python 内存过滤
      用户无需感知降级行为，一套代码适配所有 Vastbase 版本。
    rationale: |
      Vastbase PG 兼容性需实测验证，客户端降级保证兼容性覆盖面最大。
    status: confirmed

  - id: D-06
    category: 混合搜索
    title: pyvastbase 原生 hybrid_search + RRF
    decision: |
      HYBRID 查询模式使用 pyvastbase 原生 Collection.hybrid_search() API，
      以 RRFRanker 作为默认重排序器，替代上游的手动 dense+sparse 拼接→node_id 去重。
    rationale: |
      RRF 重排序结果质量优于简单去重，代码更简洁。
    status: confirmed

  - id: D-07
    category: 代码组织
    title: 单文件实现
    decision: |
      所有实现代码集中在 base.py 一个文件中（~800-1000 行），
      与上游 PGVectorStore 的代码组织结构一致。
    rationale: |
      减少包内导入路径，降低维护成本，与参考实现风格保持一致。
    status: confirmed
