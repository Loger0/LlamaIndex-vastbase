framework: LlamaIndex
version: v0.14.22
integration_mode: standalone
decisions:
  - id: D-01
    category: "API风格"
    question: "使用同步还是异步 API？"
    decision: "同步+异步（对等实现）"
    rationale: "与上游 PGVectorStore 保持一致，pyvastbase 同时支持 VastbaseClient（同步）和 AsyncCollection（异步）"
    status: resolved

  - id: D-02
    category: "依赖策略"
    question: "是否引入与上游相同的依赖栈还是用 Vastbase 原生替代？"
    decision: "全部替换为 pyvastbase"
    rationale: "pyvastbase 0.2.0+ 提供 CollectionSchema/FieldSchema/IndexParams 完整替代 SQLAlchemy declarative_base + pgvector Vector 类型 + DDL 索引管理，无需保留任何 PG 生态组件"
    status: resolved

  - id: D-03
    category: "错误处理"
    question: "沿用什么级别的错误处理策略？"
    decision: "混合策略（可配置 initialization_fail_on_error 标志）"
    rationale: "保持与上游一致的 initialization_fail_on_error 参数，默认 False（宽松），支持用户按需切换严格模式"
    status: resolved
