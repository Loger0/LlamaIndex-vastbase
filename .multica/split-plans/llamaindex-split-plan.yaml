        files:
          - "tests/conftest.py"
          - "tests/test_vastbase_integration.py"
          - "README.md"
          - ".multica/STATE.md"
        depends_on: [0, 1, 2]
        required_methods: []
        plan_tasks:
          - "Task 15: 集成测试 (conftest.py + test_vastbase_integration.py)"
          - "Task 16: STATE.md 更新 + 标签切换 + 通知"
        tests_to_pass:
          - "tests/test_integration.py (7 tests)"
        description: |
          编写端到端集成测试、完善 README 文档、更新项目状态。

          **集成测试:** 真实 Vastbase 连接的全生命周期测试（add → get_nodes → delete → clear）、
          DEFAULT 向量检索验收、多实例隔离测试、customize_search_fn 集成测试。

          **收尾:** 更新 .multica/STATE.md 标记 Phase 完成、提交所有变更、推送分支。
